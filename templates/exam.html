<!DOCTYPE html>
<html>
<head>
    <title>Mock Exam - {{ course.name }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <h1>{{ course.name }} - Mock Exam</h1>
    <form method="post">
        {% csrf_token %}
        <div class="mb-4">
            <label class="form-label">Student Name</label>
            <input class="form-control" name="student_name" value="Student" required>
        </div>
        {% for question in questions %}
        <div class="card mb-3">
            <div class="card-body">
                <h5>{{ forloop.counter }}. {{ question.question_text }}</h5>
                {% for choice in question.choices.all %}
                <div class="form-check">
                    <input class="form-check-input" type="radio" name="question_{{ question.id }}" value="{{ choice.id }}" required>
                    <label class="form-check-label">{{ choice.choice_text }}</label>
                </div>
                {% endfor %}
            </div>
        </div>
        {% endfor %}
        <button class="btn btn-success" type="submit">Submit Exam</button>
    </form>
</div>
</body>
</html>
